<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Menlo, Consolas, monospace">
	<defs>
		<marker id="farr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#b5714a" />
		</marker>
	</defs>

	<!-- stator housing -->
	<circle cx="250" cy="160" r="140" stroke="#8a8680" stroke-width="1.2" fill="none" opacity="0.35" />

	<!-- coil pairs -->
	<g stroke="#8a8680" stroke-width="1.6" fill="none">
		<circle cx="250" cy="55" r="17" />
		<circle cx="250" cy="265" r="17" />
		<circle cx="341" cy="108" r="17" />
		<circle cx="159" cy="213" r="17" />
		<circle cx="341" cy="213" r="17" />
		<circle cx="159" cy="108" r="17" />
	</g>

	<g fill="#8a8680" font-size="12" text-anchor="middle">
		<text x="250" y="60">A</text>
		<text x="250" y="270">A′</text>
		<text x="341" y="113">B′</text>
		<text x="159" y="218">B</text>
		<text x="341" y="218">C</text>
		<text x="159" y="113">C′</text>
	</g>

	<!-- rotor -->
	<path d="M216,194 L280,130" stroke="#b5714a" stroke-width="2.2" fill="none" marker-end="url(#farr)" />
	<circle cx="250" cy="160" r="4" fill="#8a8680" />

	<!-- rotation arc -->
	<path d="M198,130 A60,60 0 0 1 306,139" stroke="#b5714a" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#farr)" />

	<g fill="#8a8680" font-size="11">
		<text x="430" y="120">switch the coil pairs</text>
		<text x="430" y="138">in order:</text>
		<text x="430" y="196">the field rotates —</text>
		<text x="430" y="214">the rotor chases it</text>
	</g>
	<text x="430" y="166" fill="#b5714a" font-size="13">A → B → C → A → …</text>

	<text x="250" y="313" fill="#8a8680" font-size="10.5" text-anchor="middle">stator coils · rotor magnet in the middle</text>
</svg>
