<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Menlo, Consolas, monospace">
	<defs>
		<marker id="aarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#8a8680" />
		</marker>
		<marker id="aarrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#b5714a" />
		</marker>
	</defs>

	<g stroke="#8a8680" stroke-width="1.6" fill="none" stroke-linejoin="round">
		<!-- goal in -->
		<path d="M18,131 H98" marker-end="url(#aarr)" />
		<!-- the model -->
		<rect x="104" y="100" width="148" height="62" rx="6" />
		<path d="M252,131 H286" marker-end="url(#aarr)" />
		<!-- the harness -->
		<rect x="292" y="100" width="156" height="62" rx="6" />
		<path d="M448,131 H482" marker-end="url(#aarr)" />
		<!-- the tools -->
		<rect x="488" y="100" width="132" height="62" rx="6" />
		<!-- exit when done -->
		<path d="M178,100 V62" marker-end="url(#aarr)" />
	</g>

	<!-- the loop: result comes back -->
	<circle cx="554" cy="162" r="3.5" fill="#b5714a" />
	<path d="M554,164 V244 H178 V166" stroke="#b5714a" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#aarrA)" />

	<g fill="#8a8680" font-size="13" text-anchor="middle">
		<text x="178" y="126">the model</text>
		<text x="370" y="126">your harness</text>
		<text x="554" y="126">the tools</text>
	</g>

	<g fill="#8a8680" font-size="10.5" text-anchor="middle">
		<text x="178" y="145">picks the next step</text>
		<text x="370" y="145">actually runs it</text>
		<text x="554" y="145">files · shell · web</text>
	</g>

	<g fill="#8a8680" font-size="11">
		<text x="18" y="117">the goal</text>
		<text x="258" y="122">"run this"</text>
	</g>

	<text x="178" y="52" fill="#8a8680" font-size="11" text-anchor="middle">done → the answer</text>

	<text x="366" y="236" text-anchor="middle" fill="#b5714a" font-size="11">the result — what actually happened</text>

	<text x="320" y="284" fill="#8a8680" font-size="10.5" text-anchor="middle">the model never touches anything itself; it asks, and the harness obeys</text>
</svg>
