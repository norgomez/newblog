<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Menlo, Consolas, monospace">
	<g fill="#8a8680" font-size="10" >
		<text x="16" y="34">where the data is</text>
		<text x="624" y="34" text-anchor="end">if a register took 1 second…</text>
	</g>
	<path d="M16,42 H624" stroke="#8a8680" stroke-width="1" opacity="0.4" fill="none" />

	<!-- registers -->
	<text x="16" y="72" fill="#8a8680" font-size="11.5">registers</text>
	<rect x="128" y="61" width="6" height="14" fill="#b5714a" />
	<text x="142" y="72" fill="#8a8680" font-size="10.5">0.3 ns</text>
	<text x="624" y="72" fill="#8a8680" font-size="10.5" text-anchor="end">1 second</text>

	<!-- L1 -->
	<text x="16" y="106" fill="#8a8680" font-size="11.5">L1 cache</text>
	<rect x="128" y="95" width="29" height="14" fill="#b5714a" />
	<text x="165" y="106" fill="#8a8680" font-size="10.5">1 ns</text>
	<text x="624" y="106" fill="#8a8680" font-size="10.5" text-anchor="end">3 seconds</text>

	<!-- L2 -->
	<text x="16" y="140" fill="#8a8680" font-size="11.5">L2 cache</text>
	<rect x="128" y="129" width="62" height="14" fill="#b5714a" />
	<text x="198" y="140" fill="#8a8680" font-size="10.5">4 ns</text>
	<text x="624" y="140" fill="#8a8680" font-size="10.5" text-anchor="end">13 seconds</text>

	<!-- L3 -->
	<text x="16" y="174" fill="#8a8680" font-size="11.5">L3 cache</text>
	<rect x="128" y="163" width="94" height="14" fill="#b5714a" />
	<text x="230" y="174" fill="#8a8680" font-size="10.5">15 ns</text>
	<text x="624" y="174" fill="#8a8680" font-size="10.5" text-anchor="end">50 seconds</text>

	<!-- the chip boundary -->
	<path d="M16,190 H624" stroke="#8a8680" stroke-width="1.2" stroke-dasharray="5 4" fill="none" />
	<text x="16" y="203" fill="#b5714a" font-size="10">↓ leaves the chip here — everything below crosses a physical wire</text>

	<!-- DRAM -->
	<text x="16" y="234" fill="#8a8680" font-size="11.5">main memory</text>
	<rect x="128" y="223" width="137" height="14" fill="#b5714a" />
	<text x="273" y="234" fill="#8a8680" font-size="10.5">90 ns</text>
	<text x="624" y="234" fill="#8a8680" font-size="10.5" text-anchor="end">5 minutes</text>

	<!-- SSD -->
	<text x="16" y="268" fill="#8a8680" font-size="11.5">SSD</text>
	<rect x="128" y="257" width="300" height="14" fill="#b5714a" opacity="0.8" />
	<text x="436" y="268" fill="#8a8680" font-size="10.5">80 µs</text>
	<text x="624" y="268" fill="#8a8680" font-size="10.5" text-anchor="end">3 days</text>

	<text x="320" y="292" fill="#8a8680" font-size="10" text-anchor="middle">bars are log-scaled — a linear chart would run off the page</text>
</svg>
