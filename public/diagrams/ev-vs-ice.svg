<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Menlo, Consolas, monospace">
	<defs>
		<marker id="varr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#8a8680" />
		</marker>
		<marker id="varrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#b5714a" />
		</marker>
	</defs>

	<!-- combustion chain -->
	<g stroke="#8a8680" stroke-width="1.6" fill="none">
		<rect x="12" y="60" width="104" height="60" rx="6" />
		<rect x="140" y="60" width="104" height="60" rx="6" />
		<rect x="268" y="60" width="104" height="60" rx="6" />
		<rect x="396" y="60" width="104" height="60" rx="6" />
		<rect x="524" y="60" width="104" height="60" rx="6" />
		<path d="M116,90 H134" marker-end="url(#varr)" />
		<path d="M244,90 H262" marker-end="url(#varr)" />
		<path d="M372,90 H390" marker-end="url(#varr)" />
		<path d="M500,90 H518" marker-end="url(#varr)" />
	</g>

	<!-- electric chain -->
	<g stroke="#8a8680" stroke-width="1.6" fill="none">
		<rect x="12" y="190" width="104" height="60" rx="6" />
		<rect x="140" y="190" width="232" height="60" rx="6" />
		<rect x="396" y="190" width="104" height="60" rx="6" />
		<rect x="524" y="190" width="104" height="60" rx="6" />
		<path d="M116,220 H134" marker-end="url(#varr)" />
		<path d="M372,220 H390" marker-end="url(#varr)" />
		<path d="M500,220 H518" marker-end="url(#varr)" />
	</g>

	<!-- the collapse -->
	<rect x="134" y="54" width="244" height="72" rx="9" stroke="#b5714a" stroke-width="1.2" stroke-dasharray="5 4" fill="none" />
	<path d="M256,132 V182" stroke="#b5714a" stroke-width="1.6" fill="none" marker-end="url(#varrA)" />
	<text x="266" y="162" fill="#b5714a" font-size="10.5">collapses into one fixed ratio</text>

	<g fill="#8a8680" font-size="13" text-anchor="middle">
		<text x="64" y="95">engine</text>
		<text x="192" y="95">clutch</text>
		<text x="320" y="95">gearbox</text>
		<text x="448" y="95">differential</text>
		<text x="576" y="95">wheels</text>
		<text x="64" y="225">motor</text>
		<text x="256" y="225">one-speed reduction</text>
		<text x="448" y="225">differential</text>
		<text x="576" y="225">wheels</text>
	</g>

	<g fill="#8a8680" font-size="10" text-anchor="middle">
		<text x="64" y="272">torque from 0 rpm</text>
		<text x="256" y="272">≈9:1 · no shifting</text>
		<text x="448" y="272">still needed</text>
		<text x="576" y="272">still four patches</text>
	</g>

	<g fill="#8a8680" font-size="11">
		<text x="12" y="44">combustion</text>
		<text x="12" y="180">electric</text>
	</g>
</svg>
