<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Menlo, Consolas, monospace">
	<g fill="#8a8680" font-size="10">
		<text x="16" y="34">how far the data has to go</text>
		<text x="624" y="34" text-anchor="end">roughly how fast it gets there</text>
	</g>
	<path d="M16,42 H624" stroke="#8a8680" stroke-width="1" opacity="0.4" fill="none" />

	<!-- on-die -->
	<text x="16" y="72" fill="#8a8680" font-size="11.5">inside the die</text>
	<text x="16" y="85" fill="#8a8680" font-size="9">microns</text>
	<rect x="168" y="60" width="300" height="14" fill="#b5714a" />
	<text x="624" y="72" fill="#8a8680" font-size="10.5" text-anchor="end">tens of TB/s</text>

	<!-- HBM -->
	<text x="16" y="112" fill="#8a8680" font-size="11.5">to its own memory</text>
	<text x="16" y="125" fill="#8a8680" font-size="9">millimetres — same package</text>
	<rect x="168" y="100" width="215" height="14" fill="#b5714a" />
	<text x="624" y="112" fill="#8a8680" font-size="10.5" text-anchor="end">~3 TB/s</text>

	<!-- neighbour GPU -->
	<text x="16" y="152" fill="#8a8680" font-size="11.5">to the chip beside it</text>
	<text x="16" y="165" fill="#8a8680" font-size="9">centimetres — same server</text>
	<rect x="168" y="140" width="160" height="14" fill="#b5714a" />
	<text x="624" y="152" fill="#8a8680" font-size="10.5" text-anchor="end">~1 TB/s</text>

	<!-- the box boundary -->
	<path d="M16,180 H624" stroke="#8a8680" stroke-width="1.2" stroke-dasharray="5 4" fill="none" />
	<text x="16" y="193" fill="#b5714a" font-size="10">↓ leaves the box here — everything below is a network, not a wire</text>

	<!-- next server -->
	<text x="16" y="222" fill="#8a8680" font-size="11.5">to the next server</text>
	<text x="16" y="235" fill="#8a8680" font-size="9">metres — same rack</text>
	<rect x="168" y="210" width="61" height="14" fill="#b5714a" />
	<text x="624" y="222" fill="#8a8680" font-size="10.5" text-anchor="end">~100 GB/s</text>

	<!-- across the hall -->
	<text x="16" y="262" fill="#8a8680" font-size="11.5">across the hall</text>
	<text x="16" y="275" fill="#8a8680" font-size="9">hundreds of metres</text>
	<rect x="168" y="250" width="30" height="14" fill="#b5714a" opacity="0.8" />
	<text x="624" y="262" fill="#8a8680" font-size="10.5" text-anchor="end">~50 GB/s, and slower to start</text>

	<text x="320" y="294" fill="#8a8680" font-size="10" text-anchor="middle">bars are log-scaled — the real spread from top to bottom is several hundredfold</text>
</svg>
