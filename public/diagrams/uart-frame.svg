<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Menlo, Consolas, monospace">
	<!-- start / stop bit shading -->
	<rect x="90" y="52" width="46" height="96" fill="#b5714a" opacity="0.1" />
	<rect x="504" y="52" width="46" height="96" fill="#b5714a" opacity="0.1" />

	<!-- bit-cell dividers -->
	<g stroke="#8a8680" stroke-width="1" opacity="0.3" stroke-dasharray="3 3">
		<path d="M90,52 V148 M136,52 V148 M182,52 V148 M228,52 V148 M274,52 V148 M320,52 V148 M366,52 V148 M412,52 V148 M458,52 V148 M504,52 V148 M550,52 V148" />
	</g>

	<!-- the signal -->
	<path
		d="M44,70 H90 V130 H136 V70 H228 V130 H274 V70 H320 V130 H412 V70 H458 V130 H504 V70 H596"
		stroke="#8a8680" stroke-width="1.8" fill="none" stroke-linejoin="round"
	/>

	<g fill="#8a8680" font-size="11">
		<text x="36" y="74" text-anchor="end">1</text>
		<text x="36" y="134" text-anchor="end">0</text>
		<text x="596" y="40" text-anchor="end">time →</text>
	</g>

	<!-- bit values -->
	<g fill="#8a8680" font-size="12" text-anchor="middle">
		<text x="113" y="172">0</text>
		<text x="159" y="172">1</text>
		<text x="205" y="172">1</text>
		<text x="251" y="172">0</text>
		<text x="297" y="172">1</text>
		<text x="343" y="172">0</text>
		<text x="389" y="172">0</text>
		<text x="435" y="172">1</text>
		<text x="481" y="172">0</text>
		<text x="527" y="172">1</text>
	</g>

	<!-- cell names -->
	<g fill="#8a8680" font-size="11" text-anchor="middle">
		<text x="67" y="196">idle</text>
		<text x="113" y="196" fill="#b5714a">start</text>
		<text x="320" y="196">8 data bits — 0x4B, LSB first</text>
		<text x="527" y="196" fill="#b5714a">stop</text>
		<text x="573" y="196">idle</text>
	</g>
</svg>
