<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Menlo, Consolas, monospace">
	<text x="150" y="28" fill="#8a8680" font-size="12" text-anchor="middle">a quarter-wave whip</text>
	<text x="470" y="28" fill="#8a8680" font-size="12" text-anchor="middle">what it radiates</text>

	<path d="M132,76 V212" stroke="#b5714a" stroke-width="2.6" fill="none"/>
	<path d="M72,212 H192" stroke="#8a8680" stroke-width="1.8" fill="none"/>
	<g stroke="#8a8680" stroke-width="1" fill="none" opacity="0.7">
		<path d="M82,216 l-6,8"/><path d="M102,216 l-6,8"/><path d="M122,216 l-6,8"/>
		<path d="M142,216 l-6,8"/><path d="M162,216 l-6,8"/><path d="M182,216 l-6,8"/>
	</g>
	<text x="132" y="240" fill="#8a8680" font-size="9.5" text-anchor="middle">ground plane</text>
	<path d="M132,76 Q178,144 132,212" stroke="#b5714a" stroke-width="1.3" stroke-dasharray="4 3" fill="none" opacity="0.8"/>
	<text x="188" y="132" fill="#b5714a" font-size="9">current is</text>
	<text x="188" y="144" fill="#b5714a" font-size="9">greatest</text>
	<text x="188" y="156" fill="#b5714a" font-size="9">at the base</text>
	<path d="M104,76 V212" stroke="#8a8680" stroke-width="1" fill="none"/>
	<path d="M99,76 H109" stroke="#8a8680" stroke-width="1" fill="none"/>
	<path d="M99,212 H109" stroke="#8a8680" stroke-width="1" fill="none"/>
	<text x="94" y="148" fill="#8a8680" font-size="11" text-anchor="end">λ/4</text>

	<path d="M300,52 V248" stroke="#8a8680" stroke-width="1" stroke-dasharray="4 5" opacity="0.4" fill="none"/>

	<path d="M470,152 V96" stroke="#b5714a" stroke-width="2" fill="none"/>
	<ellipse cx="412" cy="162" rx="50" ry="32" stroke="#b5714a" stroke-width="1.7" fill="none" opacity="0.85"/>
	<ellipse cx="528" cy="162" rx="50" ry="32" stroke="#b5714a" stroke-width="1.7" fill="none" opacity="0.85"/>
	<circle cx="470" cy="162" r="3" fill="#8a8680"/>
	<path d="M470,88 V64" stroke="#8a8680" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
	<text x="470" y="56" fill="#8a8680" font-size="9" text-anchor="middle">null straight off the tip</text>
	<text x="470" y="212" fill="#8a8680" font-size="9" text-anchor="middle">strongest out to the sides</text>
	<text x="470" y="238" fill="#b5714a" font-size="9" text-anchor="middle">aim the tip at your target</text>
	<text x="470" y="250" fill="#b5714a" font-size="9" text-anchor="middle">and you get nothing</text>

	<path d="M16,268 H624" stroke="#8a8680" stroke-width="1" opacity="0.3" fill="none"/>
	<text x="320" y="288" fill="#8a8680" font-size="9.5" text-anchor="middle">gain is not amplification but focusing: more one way is always less another</text>
</svg>