<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Menlo, Consolas, monospace">
	<text x="16" y="26" fill="#8a8680" font-size="11">every decibel between the transmitter and the receiver, added up</text>

	<!-- axis -->
	<path d="M64,70 V250 H520" stroke="#8a8680" stroke-width="1" fill="none" opacity="0.6" />
	<text x="58" y="74" fill="#8a8680" font-size="8.5" text-anchor="end">+40 dBm</text>
	<text x="58" y="253" fill="#8a8680" font-size="8.5" text-anchor="end">−110</text>

	
	<rect x="74" y="85.6" width="62" height="32.4" fill="#b5714a" opacity="0.85" />
	<text x="105.0" y="268" fill="#8a8680" font-size="8.5" text-anchor="middle">transmit</text>
	<text x="105.0" y="279" fill="#8a8680" font-size="8.5" text-anchor="middle">power</text>
	<text x="105.0" y="80.6" fill="#b5714a" font-size="8.5" text-anchor="middle">27 dBm</text>
	<path d="M136,85.6 H150" stroke="#8a8680" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" fill="none" />
	<rect x="150" y="82.0" width="62" height="3.6" fill="#b5714a" opacity="0.85" />
	<text x="181.0" y="268" fill="#8a8680" font-size="8.5" text-anchor="middle">tx antenna</text>
	<text x="181.0" y="77.0" fill="#b5714a" font-size="8.5" text-anchor="middle">+3 dB</text>
	<path d="M212,82.0 H226" stroke="#8a8680" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" fill="none" />
	<rect x="226" y="82.0" width="62" height="2.0" fill="#8a8680" opacity="0.45" />
	<text x="257.0" y="268" fill="#8a8680" font-size="8.5" text-anchor="middle">tx cable</text>
	<text x="257.0" y="77.0" fill="#8a8680" font-size="8.5" text-anchor="middle">−1 dB</text>
	<path d="M288,83.2 H302" stroke="#8a8680" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" fill="none" />
	<rect x="302" y="83.2" width="62" height="144.0" fill="#8a8680" opacity="0.45" />
	<text x="333.0" y="268" fill="#8a8680" font-size="8.5" text-anchor="middle">path loss</text>
	<text x="333.0" y="279" fill="#8a8680" font-size="8.5" text-anchor="middle">10 km</text>
	<text x="333.0" y="78.2" fill="#8a8680" font-size="8.5" text-anchor="middle">−120 dB</text>
	<path d="M364,227.2 H378" stroke="#8a8680" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" fill="none" />
	<rect x="378" y="212.8" width="62" height="14.4" fill="#b5714a" opacity="0.85" />
	<text x="409.0" y="268" fill="#8a8680" font-size="8.5" text-anchor="middle">rx antenna</text>
	<text x="409.0" y="207.8" fill="#b5714a" font-size="8.5" text-anchor="middle">+12 dB</text>
	<path d="M440,212.8 H454" stroke="#8a8680" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" fill="none" />
	<rect x="454" y="212.8" width="62" height="2.4" fill="#8a8680" opacity="0.45" />
	<text x="485.0" y="268" fill="#8a8680" font-size="8.5" text-anchor="middle">rx cable</text>
	<text x="485.0" y="207.8" fill="#8a8680" font-size="8.5" text-anchor="middle">−2 dB</text>

	<!-- received level -->
	<path d="M516,215.2 H610" stroke="#b5714a" stroke-width="1.6" fill="none" />
	<text x="614" y="218.2" fill="#b5714a" font-size="9" text-anchor="end">received −81 dBm</text>

	<!-- sensitivity + noise floor -->
	<path d="M64,235.6 H610" stroke="#8a8680" stroke-width="1.2" stroke-dasharray="5 4" fill="none" />
	<text x="614" y="238.6" fill="#8a8680" font-size="9" text-anchor="end">sensitivity −98 dBm</text>
	<path d="M64,254.8 H610" stroke="#8a8680" stroke-width="1" stroke-dasharray="2 3" fill="none" opacity="0.6" />
	<text x="614" y="257.8" fill="#8a8680" font-size="8.5" text-anchor="end" opacity="0.8">noise floor −114 dBm</text>

	<!-- the margin -->
	<path d="M600,215.2 V235.6" stroke="#b5714a" stroke-width="1.2" fill="none" />
	<path d="M596,218.2 L600,215.2 L604,218.2" stroke="#b5714a" stroke-width="1.2" fill="none" />
	<path d="M596,232.6 L600,235.6 L604,232.6" stroke="#b5714a" stroke-width="1.2" fill="none" />
	<text x="592" y="228.4" fill="#b5714a" font-size="9.5" text-anchor="end">17 dB margin</text>

	<text x="320" y="292" fill="#8a8680" font-size="10" text-anchor="middle">the margin is the whole point — everything above the dashed line is what you have left when it rains</text>
</svg>
