<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="Menlo, Consolas, monospace">
	<defs>
		<marker id="warr2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#8a8680" />
		</marker>
	</defs>

	<!-- base metal -->
	<rect x="40" y="210" width="560" height="30" stroke="#8a8680" stroke-width="1.6" fill="none" />

	<!-- solidified bead with ripples -->
	<path d="M60,210 Q64,195 88,195 L318,195 Q332,195 336,210" stroke="#8a8680" stroke-width="1.6" fill="none" />
	<g stroke="#8a8680" stroke-width="1" fill="none" opacity="0.6">
		<path d="M115,196 q-9,6 -7,14" />
		<path d="M150,195 q-9,7 -7,15" />
		<path d="M185,195 q-9,7 -7,15" />
		<path d="M220,195 q-9,7 -7,15" />
		<path d="M255,195 q-9,7 -7,15" />
		<path d="M290,195 q-9,7 -7,15" />
	</g>

	<!-- torch -->
	<g stroke="#8a8680" stroke-width="1.6" fill="none">
		<rect x="370" y="50" width="44" height="90" rx="5" />
		<rect x="384" y="140" width="16" height="18" rx="2" />
		<path d="M392,158 V190" stroke-width="1.2" />
	</g>

	<!-- shielding gas envelope -->
	<g stroke="#8a8680" stroke-width="1" stroke-dasharray="4 4" fill="none" opacity="0.55">
		<path d="M372,142 C362,175 356,196 350,208" />
		<path d="M412,142 C422,175 428,196 434,208" />
	</g>

	<!-- arc -->
	<path d="M392,190 l5,5 l-9,4 l6,8" stroke="#b5714a" stroke-width="2" fill="none" stroke-linejoin="round" />

	<!-- molten puddle -->
	<ellipse cx="392" cy="209" rx="27" ry="7" stroke="#b5714a" stroke-width="1.4" fill="#b5714a" fill-opacity="0.25" />

	<!-- travel direction -->
	<path d="M250,110 H198" stroke="#8a8680" stroke-width="1.3" fill="none" marker-end="url(#warr2)" />

	<g fill="#8a8680" font-size="11">
	<text x="258" y="114">travel</text>
		<text x="430" y="100">nozzle</text>
		<text x="430" y="170">wire electrode</text>
		<text x="452" y="196">shielding gas</text>
		<text x="150" y="180" text-anchor="middle">solidified bead</text>
		<text x="90" y="229" font-size="10.5">base metal</text>
	</g>
	<text x="352" y="196" fill="#b5714a" font-size="11" text-anchor="end">arc</text>
	<text x="392" y="262" fill="#b5714a" font-size="11" text-anchor="middle">molten puddle</text>
</svg>
