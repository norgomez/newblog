<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Menlo, Consolas, monospace">
	<defs>
		<marker id="wb-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#b5714a" />
		</marker>
	</defs>

	<text x="320" y="28" fill="#8a8680" font-size="11" text-anchor="middle">One bond, four moments — and none of them involve melting</text>

	<!-- frames -->
	<g stroke="#8a8680" stroke-width="1" fill="none" opacity="0.45">
		<rect x="24" y="52" width="128" height="150" rx="5" />
		<rect x="179" y="52" width="128" height="150" rx="5" />
		<rect x="334" y="52" width="128" height="150" rx="5" />
		<rect x="489" y="52" width="128" height="150" rx="5" />
	</g>

	<!-- pads -->
	<g stroke="#8a8680" stroke-width="1.5" fill="none">
		<rect x="38" y="172" width="100" height="14" />
		<rect x="193" y="172" width="100" height="14" />
		<rect x="348" y="172" width="46" height="14" />
		<rect x="402" y="172" width="46" height="14" />
		<rect x="503" y="172" width="46" height="14" />
		<rect x="557" y="172" width="46" height="14" />
	</g>

	<!-- 1: touch down -->
	<path d="M64,110 H92 L86,138 H70 Z" stroke="#8a8680" stroke-width="1.5" fill="none" />
	<path d="M38,168 H138" stroke="#8a8680" stroke-width="2" fill="none" />
	<path d="M78,142 V162" stroke="#b5714a" stroke-width="1.8" fill="none" marker-end="url(#wb-arr)" />

	<!-- 2: scrub and weld -->
	<path d="M219,132 H247 L241,160 H225 Z" stroke="#8a8680" stroke-width="1.5" fill="none" />
	<path d="M193,168 H293" stroke="#8a8680" stroke-width="2" fill="none" />
	<path d="M212,120 H254" stroke="#b5714a" stroke-width="1.8" fill="none" marker-start="url(#wb-arr)" marker-end="url(#wb-arr)" />

	<!-- 3: loop -->
	<path d="M406,86 H434 L428,114 H412 Z" stroke="#8a8680" stroke-width="1.5" fill="none" />
	<path d="M366,168 C374,132 396,116 420,116" stroke="#8a8680" stroke-width="2" fill="none" />

	<!-- 4: second bond, tail off -->
	<path d="M521,168 C529,124 555,112 580,168" stroke="#8a8680" stroke-width="2" fill="none" />
	<path d="M594,150 L604,140" stroke="#b5714a" stroke-width="1.8" fill="none" />

	<!-- frame labels -->
	<g fill="#8a8680" font-size="10" text-anchor="middle">
		<text x="88" y="222">1 · touch down</text>
		<text x="243" y="222">2 · scrub and weld</text>
		<text x="398" y="222">3 · form the loop</text>
		<text x="553" y="222">4 · bond, break tail</text>
	</g>

	<text x="320" y="266" fill="#8a8680" font-size="10" text-anchor="middle">Force holds the wire down · ultrasonic scrub shatters the oxide · clean metal meets clean metal</text>
	<text x="320" y="284" fill="#b5714a" font-size="10" text-anchor="middle">a solid-state weld, in a few milliseconds, at room temperature</text>
</svg>
