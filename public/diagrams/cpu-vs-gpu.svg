<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Menlo, Consolas, monospace">
	<!-- CPU panel -->
	<rect x="20" y="60" width="276" height="228" rx="8" stroke="#8a8680" stroke-width="1.2" fill="none" opacity="0.45" />
	<text x="158" y="44" fill="#8a8680" font-size="14" text-anchor="middle">CPU</text>
	<text x="158" y="304" fill="#8a8680" font-size="10.5" text-anchor="middle">a few big cores · finish one thing fast</text>

	<g stroke="#b5714a" stroke-width="1.6" fill="none">
		<rect x="44" y="84" width="100" height="52" rx="5" />
		<rect x="156" y="84" width="100" height="52" rx="5" />
		<rect x="44" y="146" width="100" height="52" rx="5" />
		<rect x="156" y="146" width="100" height="52" rx="5" />
	</g>
	<g fill="#b5714a" font-size="11" text-anchor="middle">
		<text x="94" y="114">core</text>
		<text x="206" y="114">core</text>
		<text x="94" y="176">core</text>
		<text x="206" y="176">core</text>
	</g>

	<rect x="44" y="208" width="212" height="24" rx="4" stroke="#8a8680" stroke-width="1.3" fill="none" />
	<text x="150" y="224" fill="#8a8680" font-size="10.5" text-anchor="middle">control · branch prediction</text>
	<rect x="44" y="238" width="212" height="30" rx="4" stroke="#8a8680" stroke-width="1.3" fill="none" />
	<text x="150" y="257" fill="#8a8680" font-size="10.5" text-anchor="middle">large cache</text>

	<!-- GPU panel -->
	<rect x="344" y="60" width="276" height="228" rx="8" stroke="#8a8680" stroke-width="1.2" fill="none" opacity="0.45" />
	<text x="482" y="44" fill="#8a8680" font-size="14" text-anchor="middle">GPU</text>
	<text x="482" y="304" fill="#8a8680" font-size="10.5" text-anchor="middle">thousands of small ones · finish everything eventually</text>

	<g stroke="#b5714a" stroke-width="1.1" fill="none">
		<rect x="370" y="84" width="15" height="15" /><rect x="388" y="84" width="15" height="15" /><rect x="406" y="84" width="15" height="15" /><rect x="424" y="84" width="15" height="15" /><rect x="442" y="84" width="15" height="15" /><rect x="460" y="84" width="15" height="15" /><rect x="478" y="84" width="15" height="15" /><rect x="496" y="84" width="15" height="15" /><rect x="514" y="84" width="15" height="15" /><rect x="532" y="84" width="15" height="15" /><rect x="550" y="84" width="15" height="15" /><rect x="568" y="84" width="15" height="15" />
		<rect x="370" y="102" width="15" height="15" /><rect x="388" y="102" width="15" height="15" /><rect x="406" y="102" width="15" height="15" /><rect x="424" y="102" width="15" height="15" /><rect x="442" y="102" width="15" height="15" /><rect x="460" y="102" width="15" height="15" /><rect x="478" y="102" width="15" height="15" /><rect x="496" y="102" width="15" height="15" /><rect x="514" y="102" width="15" height="15" /><rect x="532" y="102" width="15" height="15" /><rect x="550" y="102" width="15" height="15" /><rect x="568" y="102" width="15" height="15" />
		<rect x="370" y="120" width="15" height="15" /><rect x="388" y="120" width="15" height="15" /><rect x="406" y="120" width="15" height="15" /><rect x="424" y="120" width="15" height="15" /><rect x="442" y="120" width="15" height="15" /><rect x="460" y="120" width="15" height="15" /><rect x="478" y="120" width="15" height="15" /><rect x="496" y="120" width="15" height="15" /><rect x="514" y="120" width="15" height="15" /><rect x="532" y="120" width="15" height="15" /><rect x="550" y="120" width="15" height="15" /><rect x="568" y="120" width="15" height="15" />
		<rect x="370" y="138" width="15" height="15" /><rect x="388" y="138" width="15" height="15" /><rect x="406" y="138" width="15" height="15" /><rect x="424" y="138" width="15" height="15" /><rect x="442" y="138" width="15" height="15" /><rect x="460" y="138" width="15" height="15" /><rect x="478" y="138" width="15" height="15" /><rect x="496" y="138" width="15" height="15" /><rect x="514" y="138" width="15" height="15" /><rect x="532" y="138" width="15" height="15" /><rect x="550" y="138" width="15" height="15" /><rect x="568" y="138" width="15" height="15" />
		<rect x="370" y="156" width="15" height="15" /><rect x="388" y="156" width="15" height="15" /><rect x="406" y="156" width="15" height="15" /><rect x="424" y="156" width="15" height="15" /><rect x="442" y="156" width="15" height="15" /><rect x="460" y="156" width="15" height="15" /><rect x="478" y="156" width="15" height="15" /><rect x="496" y="156" width="15" height="15" /><rect x="514" y="156" width="15" height="15" /><rect x="532" y="156" width="15" height="15" /><rect x="550" y="156" width="15" height="15" /><rect x="568" y="156" width="15" height="15" />
		<rect x="370" y="174" width="15" height="15" /><rect x="388" y="174" width="15" height="15" /><rect x="406" y="174" width="15" height="15" /><rect x="424" y="174" width="15" height="15" /><rect x="442" y="174" width="15" height="15" /><rect x="460" y="174" width="15" height="15" /><rect x="478" y="174" width="15" height="15" /><rect x="496" y="174" width="15" height="15" /><rect x="514" y="174" width="15" height="15" /><rect x="532" y="174" width="15" height="15" /><rect x="550" y="174" width="15" height="15" /><rect x="568" y="174" width="15" height="15" />
	</g>
	<text x="482" y="203" fill="#b5714a" font-size="10.5" text-anchor="middle">arithmetic units, all doing the same instruction</text>

	<rect x="370" y="216" width="213" height="14" rx="3" stroke="#8a8680" stroke-width="1.3" fill="none" />
	<text x="476" y="226" fill="#8a8680" font-size="9.5" text-anchor="middle">control (shared)</text>
	<rect x="370" y="236" width="213" height="16" rx="3" stroke="#8a8680" stroke-width="1.3" fill="none" />
	<text x="476" y="248" fill="#8a8680" font-size="9.5" text-anchor="middle">small cache</text>
	<text x="476" y="270" fill="#8a8680" font-size="10.5" text-anchor="middle">the silicon saved here paid for the grid above</text>
</svg>
