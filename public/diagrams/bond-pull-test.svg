<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Menlo, Consolas, monospace">
	<defs>
		<marker id="pt-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#b5714a" />
		</marker>
	</defs>

	<text x="320" y="26" fill="#8a8680" font-size="11" text-anchor="middle">A pull test is not pass or fail — it is a question of where it let go</text>

	<!-- pads -->
	<g stroke="#8a8680" stroke-width="1.5" fill="none">
		<rect x="90" y="186" width="110" height="16" />
		<rect x="440" y="186" width="110" height="16" />
	</g>

	<!-- wire loop -->
	<path d="M148,186 C168,124 240,104 320,104 C400,104 472,124 492,186" stroke="#8a8680" stroke-width="2" fill="none" />

	<!-- hook and pull -->
	<path d="M312,112 A9,9 0 1,0 328,112" stroke="#8a8680" stroke-width="1.5" fill="none" />
	<path d="M320,96 V62" stroke="#b5714a" stroke-width="1.8" fill="none" marker-end="url(#pt-arr)" />
	<text x="334" y="76" fill="#8a8680" font-size="10">pull</text>

	<!-- markers -->
	<g stroke="#b5714a" stroke-width="1.3" fill="none">
		<circle cx="126" cy="214" r="9" />
		<circle cx="182" cy="146" r="9" />
		<circle cx="424" cy="122" r="9" />
	</g>
	<g fill="#b5714a" font-size="10" text-anchor="middle">
		<text x="126" y="218">1</text>
		<text x="182" y="150">2</text>
		<text x="424" y="126">3</text>
	</g>
	<g stroke="#b5714a" stroke-width="1" fill="none">
		<path d="M133,208 L146,192" />
		<path d="M189,141 L200,130" />
		<path d="M416,126 L400,132" />
	</g>

	<!-- verdict rows -->
	<g stroke="#b5714a" stroke-width="1.3" fill="none">
		<circle cx="60" cy="248" r="8" />
		<circle cx="60" cy="272" r="8" />
		<circle cx="60" cy="296" r="8" />
	</g>
	<g fill="#b5714a" font-size="10" text-anchor="middle">
		<text x="60" y="252">1</text>
		<text x="60" y="276">2</text>
		<text x="60" y="300">3</text>
	</g>
	<g fill="#8a8680" font-size="10">
		<text x="80" y="252">lift-off at the foot — the weld never really formed</text>
		<text x="80" y="276">crack at the heel — the bend was overstressed</text>
		<text x="80" y="300">wire parts mid-span — the weld outlasted the wire</text>
	</g>
	<g font-size="10" text-anchor="end">
		<text x="618" y="252" fill="#b5714a">reject</text>
		<text x="618" y="276" fill="#8a8680">marginal</text>
		<text x="618" y="300" fill="#8a8680">what you want</text>
	</g>
</svg>
