<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Menlo, Consolas, monospace">
	<defs>
		<marker id="garr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#8a8680" />
		</marker>
		<marker id="aarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#b5714a" />
		</marker>
	</defs>

	<!-- magnet poles -->
	<rect x="40" y="118" width="30" height="94" rx="3" stroke="#8a8680" stroke-width="1.4" fill="none" />
	<rect x="200" y="118" width="30" height="94" rx="3" stroke="#8a8680" stroke-width="1.4" fill="none" />
	<text x="55" y="171" fill="#8a8680" font-size="16" text-anchor="middle" font-weight="bold">N</text>
	<text x="215" y="171" fill="#8a8680" font-size="16" text-anchor="middle" font-weight="bold">S</text>

	<!-- field lines N -> S -->
	<g stroke="#8a8680" stroke-width="1" opacity="0.55" fill="none">
		<path d="M74,142 H196" marker-end="url(#garr)" />
		<path d="M74,165 H196" marker-end="url(#garr)" />
		<path d="M74,188 H196" marker-end="url(#garr)" />
	</g>

	<!-- spinning coil (shown edge-on, tilted) -->
	<g transform="rotate(22 135 165)">
		<ellipse cx="135" cy="165" rx="12" ry="46" stroke="#b5714a" stroke-width="2.4" fill="none" />
	</g>
	<line x1="135" y1="118" x2="135" y2="212" stroke="#b5714a" stroke-width="0.8" opacity="0.35" />
	<circle cx="135" cy="165" r="3" fill="#b5714a" />

	<!-- rotation arrow -->
	<path d="M120,116 A22,22 0 0 1 158,120" stroke="#b5714a" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#aarr)" />

	<text x="135" y="238" fill="#8a8680" font-size="10.5" text-anchor="middle">spin the coil</text>
	<text x="135" y="252" fill="#8a8680" font-size="10.5" text-anchor="middle">in the field</text>

	<!-- arrow from schematic to waveform -->
	<path d="M250,165 H292" stroke="#8a8680" stroke-width="1.2" fill="none" marker-end="url(#garr)" opacity="0.7" />

	<!-- voltage axis -->
	<path d="M300,238 V86" stroke="#8a8680" stroke-width="1.2" fill="none" marker-end="url(#garr)" />
	<path d="M300,160 H610" stroke="#8a8680" stroke-width="1.2" fill="none" marker-end="url(#garr)" />
	<text x="292" y="96" fill="#8a8680" font-size="10.5" text-anchor="end">V</text>
	<text x="612" y="176" fill="#8a8680" font-size="10.5" text-anchor="end">time</text>

	<!-- sine output -->
	<path d="M300,160.0 L303,152.48 L306,145.08 L309,137.91 L312,131.09 L315,124.73 L318,118.93 L321,113.77 L324,109.34 L327,105.71 L330,102.94 L333,101.06 L336,100.12 L339,100.12 L342,101.06 L345,102.94 L348,105.71 L351,109.34 L354,113.77 L357,118.93 L360,124.73 L363,131.09 L366,137.91 L369,145.08 L372,152.48 L375,160.0 L378,167.52 L381,174.92 L384,182.09 L387,188.91 L390,195.27 L393,201.07 L396,206.23 L399,210.66 L402,214.29 L405,217.06 L408,218.94 L411,219.88 L414,219.88 L417,218.94 L420,217.06 L423,214.29 L426,210.66 L429,206.23 L432,201.07 L435,195.27 L438,188.91 L441,182.09 L444,174.92 L447,167.52 L450,160.0 L453,152.48 L456,145.08 L459,137.91 L462,131.09 L465,124.73 L468,118.93 L471,113.77 L474,109.34 L477,105.71 L480,102.94 L483,101.06 L486,100.12 L489,100.12 L492,101.06 L495,102.94 L498,105.71 L501,109.34 L504,113.77 L507,118.93 L510,124.73 L513,131.09 L516,137.91 L519,145.08 L522,152.48 L525,160.0 L528,167.52 L531,174.92 L534,182.09 L537,188.91 L540,195.27 L543,201.07 L546,206.23 L549,210.66 L552,214.29 L555,217.06 L558,218.94 L561,219.88 L564,219.88 L567,218.94 L570,217.06 L573,214.29 L576,210.66 L579,206.23 L582,201.07 L585,195.27 L588,188.91 L591,182.09 L594,174.92 L597,167.52 L600,160.0 L603,152.48 L606,145.08" stroke="#b5714a" stroke-width="2.2" fill="none" stroke-linejoin="round" />

	<!-- peak marker -->
	<circle cx="337.5" cy="100.0" r="3.5" fill="#b5714a" />
	<text x="337.5" y="91.0" fill="#8a8680" font-size="10" text-anchor="middle">cutting across → peak</text>

	<!-- zero marker -->
	<circle cx="375.0" cy="160.0" r="3.5" fill="#8a8680" />
	<text x="381.0" y="176.0" fill="#8a8680" font-size="10" text-anchor="middle">sliding along → zero</text>

	<text x="455" y="300" fill="#8a8680" font-size="10.5" text-anchor="middle">one turn of the loop = one full cycle of alternating voltage</text>
</svg>
