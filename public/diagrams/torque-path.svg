<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="Menlo, Consolas, monospace">
	<defs>
		<marker id="tarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#8a8680" />
		</marker>
	</defs>

	<g stroke="#8a8680" stroke-width="1.6" fill="none">
		<rect x="12" y="84" width="104" height="64" rx="6" />
		<rect x="140" y="84" width="104" height="64" rx="6" />
		<rect x="268" y="84" width="104" height="64" rx="6" />
		<rect x="396" y="84" width="104" height="64" rx="6" />
		<rect x="524" y="84" width="104" height="64" rx="6" />
		<path d="M116,116 H134" marker-end="url(#tarr)" />
		<path d="M244,116 H262" marker-end="url(#tarr)" />
		<path d="M372,116 H390" marker-end="url(#tarr)" />
		<path d="M500,116 H518" marker-end="url(#tarr)" />
	</g>

	<g fill="#8a8680" font-size="13" text-anchor="middle">
		<text x="64" y="121">engine</text>
		<text x="192" y="121">clutch</text>
		<text x="320" y="121">gearbox</text>
		<text x="448" y="121">differential</text>
		<text x="576" y="121">wheels</text>
	</g>

	<g fill="#8a8680" font-size="10" text-anchor="middle">
		<text x="64" y="168">burns fuel,</text>
		<text x="64" y="182">makes torque</text>
		<text x="192" y="168">connects or</text>
		<text x="192" y="182">disconnects</text>
		<text x="320" y="168">trades speed</text>
		<text x="320" y="182">for torque</text>
		<text x="448" y="168">splits drive,</text>
		<text x="448" y="182">allows speed Δ</text>
		<text x="576" y="168">four palm-size</text>
		<text x="576" y="182">contact patches</text>
	</g>

	<g fill="#b5714a" font-size="11" text-anchor="middle">
		<text x="64" y="208">150 N·m</text>
		<text x="320" y="208">× 3.5</text>
		<text x="448" y="208">× 3.8</text>
		<text x="576" y="208">≈ 2,000 N·m</text>
	</g>
</svg>
