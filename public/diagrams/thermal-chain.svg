<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Menlo, Consolas, monospace">
	<defs>
		<marker id="harr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#b5714a" />
		</marker>
	</defs>

	<text x="320" y="38" fill="#8a8680" font-size="11" text-anchor="middle">~300 watts enters on the left and leaves on the right — none of it is destroyed anywhere in between</text>

	<!-- boxes -->
	<g stroke="#8a8680" stroke-width="1.5" fill="none">
		<rect x="20" y="112" width="96" height="64" rx="5" />
		<rect x="146" y="112" width="96" height="64" rx="5" />
		<rect x="272" y="112" width="96" height="64" rx="5" />
		<rect x="398" y="112" width="96" height="64" rx="5" />
		<rect x="524" y="112" width="96" height="64" rx="5" />
	</g>

	<!-- heat-flow arrows -->
	<g stroke="#b5714a" stroke-width="1.8" fill="none">
		<path d="M118,144 H142" marker-end="url(#harr)" />
		<path d="M244,144 H268" marker-end="url(#harr)" />
		<path d="M370,144 H394" marker-end="url(#harr)" />
		<path d="M496,144 H520" marker-end="url(#harr)" />
	</g>

	<!-- temperatures -->
	<g fill="#b5714a" font-size="12" text-anchor="middle">
		<text x="68" y="100">100 °C</text>
		<text x="194" y="100">80 °C</text>
		<text x="320" y="100">60 °C</text>
		<text x="446" y="100">40 °C</text>
		<text x="572" y="100">22 °C</text>
	</g>

	<!-- labels -->
	<g fill="#8a8680" font-size="11" text-anchor="middle">
		<text x="68" y="142">the transistor</text>
		<text x="194" y="142">package</text>
		<text x="320" y="142">heatsink</text>
		<text x="446" y="142">case air</text>
		<text x="572" y="142">the room</text>
	</g>
	<g fill="#8a8680" font-size="9.5" text-anchor="middle">
		<text x="68" y="160">where it starts</text>
		<text x="194" y="160">silicon + solder</text>
		<text x="320" y="160">paste + metal</text>
		<text x="446" y="160">fins + fan</text>
		<text x="572" y="160">and then outdoors</text>
	</g>

	<!-- resistance annotations -->
	<g fill="#8a8680" font-size="9" text-anchor="middle">
		<text x="130" y="196">20°</text>
		<text x="256" y="196">20°</text>
		<text x="382" y="196">20°</text>
		<text x="508" y="196">18°</text>
	</g>
	<text x="320" y="216" fill="#8a8680" font-size="10" text-anchor="middle">every arrow is paid for with a temperature drop</text>

	<path d="M20,238 H620" stroke="#8a8680" stroke-width="1" opacity="0.35" fill="none" />
	<text x="320" y="260" fill="#b5714a" font-size="10.5" text-anchor="middle">heat only ever flows downhill — you cannot delete a watt, only push it somewhere cooler</text>
	<text x="320" y="280" fill="#8a8680" font-size="10" text-anchor="middle">the transistor's temperature is set by the whole chain, so the weakest link decides how fast the chip may run</text>
</svg>
