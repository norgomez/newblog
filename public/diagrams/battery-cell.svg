<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Menlo, Consolas, monospace">
	<defs>
		<marker id="barr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#8a8680" />
		</marker>
		<marker id="barrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#b5714a" />
		</marker>
	</defs>

	<!-- electrodes -->
	<g stroke="#8a8680" stroke-width="1.6" fill="none">
		<rect x="140" y="120" width="80" height="140" rx="4" />
		<rect x="420" y="120" width="80" height="140" rx="4" />
		<rect x="280" y="36" width="80" height="48" rx="6" />
	</g>

	<!-- separator -->
	<path d="M320,120 V260" stroke="#8a8680" stroke-width="1.2" stroke-dasharray="4 4" fill="none" opacity="0.6" />

	<!-- external electron path -->
	<g stroke="#b5714a" stroke-width="1.8" fill="none" stroke-linejoin="round">
		<path d="M180,120 V60 H274" marker-end="url(#barrA)" />
		<path d="M360,60 H460 V114" marker-end="url(#barrA)" />
	</g>

	<!-- ions crossing inside -->
	<g stroke="#8a8680" stroke-width="1.5" fill="none">
		<path d="M240,170 H300" marker-end="url(#barr)" />
		<path d="M340,170 H400" marker-end="url(#barr)" />
		<path d="M240,205 H300" marker-end="url(#barr)" />
		<path d="M340,205 H400" marker-end="url(#barr)" />
	</g>

	<g fill="#8a8680" font-size="11" text-anchor="middle">
		<text x="180" y="108">anode (−)</text>
		<text x="460" y="108">cathode (+)</text>
		<text x="320" y="108">electrolyte</text>
		<text x="320" y="156">Li⁺</text>
		<text x="320" y="64">your device</text>
		<text x="320" y="282">separator — ions pass, electrons cannot</text>
	</g>

	<g fill="#b5714a" font-size="11">
		<text x="238" y="50">e⁻</text>
		<text x="398" y="50">e⁻</text>
	</g>
	<text x="320" y="20" fill="#b5714a" font-size="11" text-anchor="middle">electrons — the useful part</text>
</svg>
