<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Menlo, Consolas, monospace">
	<defs>
		<marker id="hs-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#b5714a" />
		</marker>
	</defs>

	<text x="320" y="26" fill="#8a8680" font-size="11" text-anchor="middle">The heat is made inside the plastic, not applied to it</text>

	<!-- the stack -->
	<g stroke="#8a8680" stroke-width="1.5" fill="none">
		<rect x="44" y="46" width="102" height="36" rx="5" />
		<rect x="194" y="46" width="102" height="36" rx="5" />
		<rect x="344" y="46" width="102" height="36" rx="5" />
		<rect x="494" y="46" width="102" height="36" rx="5" />
	</g>
	<g fill="#8a8680" font-size="10" text-anchor="middle">
		<text x="95" y="68">generator</text>
		<text x="245" y="68">converter</text>
		<text x="395" y="68">booster</text>
		<text x="545" y="68">horn</text>
	</g>
	<g stroke="#b5714a" stroke-width="1.6" fill="none">
		<path d="M146,64 H188" marker-end="url(#hs-arr)" />
		<path d="M296,64 H338" marker-end="url(#hs-arr)" />
		<path d="M446,64 H488" marker-end="url(#hs-arr)" />
	</g>
	<text x="320" y="100" fill="#8a8680" font-size="10" text-anchor="middle">20 kHz electrical · piezo turns it to motion · amplitude scaled · delivered</text>

	<!-- section labels -->
	<g fill="#8a8680" font-size="11" text-anchor="middle">
		<text x="180" y="140">before</text>
		<text x="460" y="140">after</text>
	</g>

	<!-- BEFORE: horn -->
	<rect x="152" y="152" width="56" height="36" rx="3" stroke="#8a8680" stroke-width="1.5" fill="none" />
	<text x="180" y="174" fill="#8a8680" font-size="10" text-anchor="middle">horn</text>
	<path d="M180,190 V202" stroke="#b5714a" stroke-width="1.8" fill="none" marker-end="url(#hs-arr)" />

	<!-- BEFORE: part stack -->
	<g stroke="#8a8680" stroke-width="1.5" fill="none">
		<rect x="172" y="208" width="16" height="50" />
		<rect x="92" y="236" width="80" height="22" />
		<rect x="188" y="236" width="80" height="22" />
		<rect x="82" y="258" width="196" height="30" />
	</g>
	<text x="196" y="222" fill="#8a8680" font-size="10">boss</text>
	<text x="86" y="230" fill="#8a8680" font-size="10" text-anchor="end">Al bar</text>
	<path d="M88,226 L96,236" stroke="#8a8680" stroke-width="1" fill="none" />

	<!-- AFTER: part stack -->
	<g stroke="#8a8680" stroke-width="1.5" fill="none">
		<rect x="372" y="236" width="80" height="22" />
		<rect x="468" y="236" width="80" height="22" />
		<rect x="362" y="258" width="196" height="30" />
		<rect x="452" y="236" width="16" height="22" />
	</g>
	<path d="M432,236 Q460,208 488,236" stroke="#b5714a" stroke-width="1.8" fill="none" />
	<text x="496" y="218" fill="#b5714a" font-size="10">head</text>
	<path d="M492,214 L474,220" stroke="#b5714a" stroke-width="1" fill="none" />

	<!-- captions -->
	<g fill="#8a8680" font-size="10" text-anchor="middle">
		<text x="180" y="308">boss stands proud through a hole in the bar</text>
		<text x="460" y="308">reformed head clamps the bar down</text>
	</g>
</svg>
