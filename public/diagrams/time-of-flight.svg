<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Menlo, Consolas, monospace">
	<defs>
		<marker id="tof" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#b5714a" />
		</marker>
		<marker id="tofg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M0,0 L10,5 L0,10 z" fill="#8a8680" />
		</marker>
	</defs>

	<!-- sensor -->
	<rect x="30" y="96" width="66" height="58" rx="5" stroke="#8a8680" stroke-width="1.5" fill="none" />
	<text x="63" y="121" fill="#8a8680" font-size="10" text-anchor="middle">sensor</text>
	<text x="63" y="135" fill="#8a8680" font-size="8.5" text-anchor="middle">and clock</text>

	<!-- target -->
	<rect x="500" y="80" width="46" height="90" rx="4" stroke="#8a8680" stroke-width="1.5" fill="none" />
	<text x="523" y="130" fill="#8a8680" font-size="10" text-anchor="middle">target</text>

	<!-- outgoing pulse -->
	<path d="M100,112 H492" stroke="#b5714a" stroke-width="1.8" fill="none" marker-end="url(#tof)" />
	<text x="296" y="103" fill="#b5714a" font-size="10" text-anchor="middle">send a pulse at a known speed v</text>

	<!-- return -->
	<path d="M492,140 H100" stroke="#b5714a" stroke-width="1.8" fill="none" marker-end="url(#tof)" stroke-dasharray="6 4" />
	<text x="296" y="157" fill="#b5714a" font-size="10" text-anchor="middle">…and start counting until the echo lands</text>

	<!-- distance bracket -->
	<path d="M100,190 H492" stroke="#8a8680" stroke-width="1" fill="none" />
	<path d="M100,185 V195" stroke="#8a8680" stroke-width="1" fill="none" />
	<path d="M492,185 V195" stroke="#8a8680" stroke-width="1" fill="none" />
	<text x="296" y="183" fill="#8a8680" font-size="10" text-anchor="middle">d</text>

	<!-- the equation -->
	<text x="296" y="222" fill="#8a8680" font-size="15" text-anchor="middle">d = v × t ÷ 2</text>
	<text x="296" y="240" fill="#8a8680" font-size="9.5" text-anchor="middle">halved, because the pulse made the trip twice</text>

	<!-- the family -->
	<path d="M30,258 H610" stroke="#8a8680" stroke-width="1" opacity="0.35" fill="none" />
	<g fill="#8a8680" font-size="9.5">
		<text x="30" y="276">ultrasonic</text>
		<text x="132" y="276">sonar</text>
		<text x="216" y="276">radar</text>
		<text x="296" y="276">lidar</text>
		<text x="376" y="276">GPS</text>
	</g>
	<g fill="#8a8680" font-size="8" opacity="0.8">
		<text x="30" y="288">343 m/s</text>
		<text x="132" y="288">1480 m/s</text>
		<text x="216" y="288">3×10⁸</text>
		<text x="296" y="288">3×10⁸</text>
		<text x="376" y="288">3×10⁸, one way</text>
	</g>
	<text x="610" y="276" fill="#b5714a" font-size="9.5" text-anchor="end">same trick, different medium</text>
	<text x="610" y="288" fill="#8a8680" font-size="8" text-anchor="end" opacity="0.8">only v changes</text>
</svg>
